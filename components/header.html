<!-- @dsCard group="Components" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../tokens.css">
<style>
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px}
  .shield{width:30px;height:30px;display:grid;place-items:center;background:var(--teal);border-radius:8px}
  .shield svg{width:20px;height:20px}
  .brand{font-size:17px;font-weight:var(--fw-heavy);color:var(--ink);letter-spacing:-.01em}
  .brand span{color:var(--teal)}
  .spacer{flex:1}
  .cta{font-size:13px;font-weight:var(--fw-bold);color:#fff;background:var(--teal);border:0;border-radius:var(--radius);padding:8px 14px;cursor:pointer}
  .ghost{font-size:13px;font-weight:var(--fw-semibold);color:var(--teal-dark);background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:8px 14px;cursor:pointer}
  .banner{background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);padding:7px 16px;line-height:1.45}
</style></head>
<body>
  <header>
    <span class="shield"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.5 8.8-8 11-4.5-2.2-8-6-8-11V5l8-3z" fill="#fff" opacity=".25"/><path d="M8.5 12.3l2.4 2.4 4.8-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="brand">Gluten<span>Safe</span></span>
    <span class="spacer"></span>
    <button class="ghost">Sign in</button>
    <button class="cta">Claim your venue</button>
  </header>
  <div class="banner">Two independent signals, never merged: <b>can I eat here at all</b> vs <b>is it coeliac-safe</b>. Always confirm with the venue before eating.</div>
</body></html>
